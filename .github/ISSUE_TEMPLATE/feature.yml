name: Feature Task
description: Propose a feature or change. Written so an agent can implement it from the issue alone.
title: "[FEAT] "
labels: ["type:feat", "needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user-visible or code-level outcome is wanted, and why.
      placeholder: "Let users filter nearby places by open-now status."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Select every area the change touches.
      multiple: true
      options:
        - "src/app (routes / navigation)"
        - "src/components (UI)"
        - "src/config"
        - "modules/nearby-places (native MapKit module)"
        - "Tooling / config (package.json, babel, metro, tailwind, CI)"
        - "Other / docs"
    validations:
      required: true
  - type: dropdown
    id: native
    attributes:
      label: Native Change?
      description: Choose Yes if the change touches a native module, a native dependency, or app.json plugins. Yes requires a simulator or device check before the PR is opened.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files Likely Touched
      description: Paths you already know about. Optional.
      placeholder: "src/components/HomeScreen.tsx, src/hooks/usePlaceSearch.ts"
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Concrete, testable conditions. The change is done when all are true.
      value: |
        - [ ]
        - [ ] Unit test added for new logic (or explain why not)
        - [ ] `bunx tsc --noEmit`, `bun run lint`, `bun run test` pass
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What must NOT change. Prevents over-building.
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: Estimated Size
      description: XS = one file, trivial. S = one component or module. M = several files plus tests. L = cross-cutting or native. XL = split it first.
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL (split before implementing)"
    validations:
      required: true
